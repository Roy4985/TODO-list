<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="What do you need to do?">
      <button type="submit">Add</button>
    </form>
    <p id="error" class="error"></p>

    <ul id="task-list">
      <li><span class="title">Example task</span><button class="delete">✕</button></li>
      <li class="done"><span class="title">Finished task</span><button class="delete">✕</button></li>
    </ul>

    <p id="counter" class="counter"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
